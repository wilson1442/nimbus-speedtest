<style>
body{margin:0}
a{color:#3D7DBF}a:hover{color:#2E6AA8}
.nm-grid{background-image:linear-gradient(#DCE6EF 1px,transparent 1px),linear-gradient(90deg,#DCE6EF 1px,transparent 1px);background-size:80px 80px}
.nm-bars .b{flex:1 1 0;height:340px;border-radius:6px 6px 0 0;background:#CFE1F2;transform-origin:50% 100%;animation:nmBar 1.4s ease-in-out infinite}
.nm-bars .b:nth-child(2n){animation-duration:1.1s;background:#BCD6EE}
.nm-bars .b:nth-child(3n){animation-delay:-.45s}
.nm-bars .b:nth-child(4n+1){animation-duration:1.7s}
.nm-bars .b:nth-child(5n){animation-duration:.85s;animation-delay:-.2s}
.nm-bars .b:nth-child(7n){animation-delay:-.9s}
.nm-bars .b:nth-child(11n){animation-duration:2.1s}
@keyframes nmBar{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(1)}}
.nm-scroll{animation:nmScroll 3.2s linear infinite}
@keyframes nmScroll{from{transform:translateX(0)}to{transform:translateX(-1920px)}}
.nm-scan{animation:nmScan 4s ease-in-out infinite}
@keyframes nmScan{0%{transform:translateX(-200px)}100%{transform:translateX(2120px)}}
.nm-spin{animation:nmSpin 2.4s linear infinite;transform-origin:50% 50%}
.nm-spin-slow{animation:nmSpin 18s linear infinite reverse;transform-origin:50% 50%}
@keyframes nmSpin{to{transform:rotate(360deg)}}
.nm-pulse{animation:nmPulse 1.2s ease-in-out infinite}
@keyframes nmPulse{0%,100%{box-shadow:0 0 0 0 rgba(91,155,213,.45)}50%{box-shadow:0 0 0 12px rgba(91,155,213,0)}}
.nm-blink{animation:nmBlink 1s steps(2) infinite}
@keyframes nmBlink{50%{opacity:.25}}
.nm-nav{text-decoration:none}
</style>
</helmet>
